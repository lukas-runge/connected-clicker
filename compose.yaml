services:
  postgres:
    image: postgres:18-alpine
    container_name: connected-clicker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: connected_clicker
      POSTGRES_PASSWORD: connected_clicker
      POSTGRES_DB: connected_clicker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connected_clicker -d connected_clicker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
